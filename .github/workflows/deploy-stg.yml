name: deploy-stg

on:
  push:
    branches: [STG]
  workflow_dispatch:

concurrency:
  group: deploy-stg
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required to mint the OIDC token WIF exchanges

env:
  SERVICE: medusa-backend
  APP_ENV: stg

jobs:
  deploy:
    name: build · push · roll out
    runs-on: ubuntu-latest
    environment:
      name: stg
      url: https://api-stg-medusa.fabianalula.site
    steps:
      - uses: actions/checkout@v4

      # Keyless. The org enforces iam.disableServiceAccountKeyCreation, so there
      # is no JSON key anywhere: GitHub's OIDC token is exchanged for a
      # short-lived credential, and only this repository can make that trade.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Artifact Registry auth
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        env:
          IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_AR_REPOSITORY }}/${{ env.SERVICE }}
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:stg
          build-args: |
            APP_VERSION=stg-${{ github.run_number }}
            APP_COMMIT=${{ github.sha }}
            APP_ENV=stg
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # IAP tunnel — the VM has no inbound firewall opening and no static IP.
      - name: Roll out to the instance
        env:
          IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_AR_REPOSITORY }}/${{ env.SERVICE }}
        run: |
          gcloud compute ssh ${{ secrets.GCP_VM_NAME }} \
            --zone="${{ secrets.GCP_ZONE }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --tunnel-through-iap \
            --quiet \
            --command="sudo /bin/bash /var/lib/medusa/deploy.sh ${IMAGE}:${{ github.sha }}"

      - name: Verify the public endpoint serves this commit
        run: |
          for i in $(seq 1 30); do
            BODY=$(curl -fsS https://api-stg-medusa.fabianalula.site/ 2>/dev/null || true)
            if echo "$BODY" | grep -q "${{ github.sha }}"; then
              echo "✅ live and serving ${{ github.sha }}"
              echo "$BODY"
              exit 0
            fi
            echo "attempt $i — not yet serving this commit"
            sleep 5
          done
          echo "::error::endpoint never reported commit ${{ github.sha }}"
          exit 1

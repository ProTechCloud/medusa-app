name: deploy-stg

# The file name, the `stg` environment and the branch are all part of the
# identity medusa-platform trusts (repository|workflow|environment|ref). Renaming
# any of them makes the Google sign-in fail.
on:
  push:
    branches: [stg]

# One rollout at a time, never interrupted: a cancelled run can leave the VM
# between images.
concurrency:
  group: deploy-stg
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ${{ vars.GCP_REGISTRY }}/medusa-backend:${{ github.sha }}
  TRIVY_VERSION: 0.76.1

jobs:
  # No cloud credentials here. The image is built and scanned first, and only
  # an image that passed reaches the job that can push it.
  build:
    name: build
    if: vars.BACKEND_CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ env.IMAGE }}
          build-args: |
            APP_VERSION=stg-${{ github.run_number }}
            APP_COMMIT=${{ github.sha }}
            APP_ENV=stg
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The binary at a pinned version with its checksum verified, as in
      # medusa-platform: a scanner that silently gains rules turns a green
      # branch red with no commit to explain it.
      - name: Install trivy
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/trivy_${TRIVY_VERSION}_checksums.txt" \
            | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" trivy
          sudo mv trivy /usr/local/bin/

      - name: Scan image
        run: trivy image --input "${{ runner.temp }}/image.tar" --severity CRITICAL --exit-code 1

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment: stg
    permissions:
      contents: read
      id-token: write # the OIDC token Workload Identity Federation exchanges
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}

      # Signs in as the hub, which holds no permissions of its own. Its only
      # capability is impersonating the spoke, which is what is set next.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_HUB }}
          audience: ${{ vars.GCP_WIF_AUDIENCE }}

      - uses: google-github-actions/setup-gcloud@v2

      # From here every gcloud call runs as the spoke, and so does docker:
      # its credential helper asks gcloud for the token.
      - name: Impersonate the deploy spoke
        run: gcloud config set auth/impersonate_service_account "${{ vars.GCP_DEPLOY_SPOKE }}"

      - name: Push image
        run: |
          gcloud auth configure-docker "${IMAGE%%/*}" --quiet
          docker load --input "${{ runner.temp }}/image.tar"
          docker push "$IMAGE"

      # IAP tunnel: the VM has no inbound firewall opening and no public IP.
      # The check runs over the same SSH hop, against the app itself rather
      # than the public hostname, which still points at the old stack.
      # deploy.sh logs to stderr so stdout carries only the app's answer.
      - name: Roll out and verify
        shell: bash
        run: |
          set -euo pipefail
          body=$(gcloud compute ssh "${{ vars.GCP_VM_NAME }}" \
            --zone="${{ vars.GCP_ZONE }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --tunnel-through-iap \
            --quiet \
            --command="sudo /etc/medusa/deploy.sh '$IMAGE' >&2 && curl -fsS http://127.0.0.1:8080/")
          echo "$body"

          commit=$(echo "$body" | jq -r '.commit')
          if [ "$commit" != "${{ github.sha }}" ]; then
            echo "::error::VM answered with commit '$commit', expected ${{ github.sha }}"
            exit 1
          fi
          echo "✅ VM is serving ${{ github.sha }}"

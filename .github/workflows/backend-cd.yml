name: Backend - CD

# The file name, the `backend-stg` environment and the branch are all part of
# the identity medusa-platform trusts (repository|workflow|environment|ref).
# Renaming any of them makes the Google sign-in fail.
#
# The path filter is safe here, unlike on the quality workflow: nothing waits
# on this run as a required check. A push that touches none of these — a
# docs-only promotion — has nothing new to deploy.
#
# workflow_dispatch redeploys the current `stg` on demand, for a change the path
# filter skips. The build job refuses any other branch, and Google would refuse
# its sign-in anyway.
on:
  workflow_dispatch:
  push:
    branches: [stg]
    paths:
      - apps/backend/**
      - package.json
      - yarn.lock
      - .yarnrc.yml
      - .nvmrc
      - turbo.json
      - tsconfig.json
      - biome.json
      - commitlint.config.mjs
      - .dockerignore
      - .github/workflows/backend-cd.yml
      - .github/actions/install-trivy/**
      - .github/scripts/deploy/**

# One rollout at a time, never interrupted: Cloud Run keeps the previous
# revision serving until the new one is healthy, but two rollouts racing would
# leave the verification below checking the wrong one.
concurrency:
  group: backend-cd
  cancel-in-progress: false

permissions:
  contents: read

env:
  TRIVY_VERSION: 0.76.1

jobs:
  # No cloud credentials here. The image is built and scanned first, and only
  # an image that passed reaches the job that can push it. It is tagged by
  # commit only; the registry path is the deploy job's.
  build:
    name: build
    if: vars.BACKEND_CD_ENABLED == 'true' && github.ref == 'refs/heads/stg'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The repository root, where the lockfile and workspace manifest live.
          context: .
          file: apps/backend/Dockerfile
          tags: medusa-backend:${{ github.sha }}
          build-args: |
            APP_VERSION=stg-${{ github.run_number }}
            APP_COMMIT=${{ github.sha }}
            APP_ENV=stg
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: ./.github/actions/install-trivy
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: Scan image
        run: trivy image --input "${{ runner.temp }}/image.tar" --severity CRITICAL --exit-code 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  # Where it deploys to comes from the `backend-stg` environment's variables.
  # A prd deploy still changes three things: a `backend-prd` environment with
  # the same names, a prd target in this file (the branch, the environment and
  # the build arguments), and the trust rule in medusa-platform, which names the
  # environment.
  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment: backend-stg
    permissions:
      contents: read
      id-token: write # the OIDC token Workload Identity Federation exchanges
    env:
      IMAGE: ${{ vars.GCP_REGISTRY }}/medusa-backend:${{ github.sha }}
      LOCAL_IMAGE: medusa-backend:${{ github.sha }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.GCP_RUN_SERVICE }}
      API_HOSTNAME: ${{ vars.API_HOSTNAME }}
      COMMIT: ${{ github.sha }}
    steps:
      # For the scripts only; no credentials are kept.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      # Signs in as the hub, which holds no permissions of its own. Its only
      # capability is impersonating the spoke, which is what is set next.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_HUB }}
          audience: ${{ vars.GCP_WIF_AUDIENCE }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # From here every gcloud call runs as the spoke, and so does docker:
      # its credential helper asks gcloud for the token.
      - name: Impersonate the deploy spoke
        run: gcloud config set auth/impersonate_service_account "${{ vars.GCP_DEPLOY_SPOKE }}"

      # For the re-run case below, where the image deployed is the one already
      # in the registry rather than the one scanned above.
      - uses: ./.github/actions/install-trivy
        with:
          version: ${{ env.TRIVY_VERSION }}

      # A tag is pushed once: a re-run of a commit that was already pushed
      # reuses its image instead of pushing over it, after scanning that image
      # with today's rules.
      - name: Push the image
        env:
          IMAGE_TAR: ${{ runner.temp }}/image.tar
        run: .github/scripts/deploy/push-image.sh

      # A new revision with this image and nothing else changed; the service
      # definition is medusa-platform's. Traffic moves only once the revision
      # is healthy, and the public hostname is then asked which commit it
      # serves.
      - name: Roll out and verify
        run: .github/scripts/deploy/rollout.sh

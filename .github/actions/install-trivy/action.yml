name: Install trivy
description: >-
  The trivy binary at a pinned version with its checksum verified, as in
  medusa-platform. A scanner that silently gains rules turns a green branch red
  with no commit to explain it.

inputs:
  version:
    description: trivy release, without the leading v
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        TRIVY_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
        tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        curl -sSfLO "$base/$tarball"
        curl -sSfL "$base/trivy_${TRIVY_VERSION}_checksums.txt" \
          | grep " $tarball\$" | sha256sum -c -
        tar -xzf "$tarball" trivy
        sudo mv trivy /usr/local/bin/

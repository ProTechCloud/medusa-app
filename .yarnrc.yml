# A plain node_modules tree: Bun runs the app and resolves modules the Node
# way, so Plug'n'Play would leave it unable to find anything.
nodeLinker: node-modules

# Third-party install scripts never run. The workspace's own postinstall
# (husky) still does.
enableScripts: false

# A version younger than three days is not installed. Most compromised
# releases are caught and pulled inside that window.
npmMinimalAgeGate: 3d
